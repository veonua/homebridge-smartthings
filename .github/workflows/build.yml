name: Build and Test

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            homebridge: 1
            hap_module: hap-nodejs
          - node: 24
            homebridge: 1
            hap_module: hap-nodejs
          - node: 22
            homebridge: 2
            hap_module: '@homebridge/hap-nodejs'
          - node: 24
            homebridge: 2
            hap_module: '@homebridge/hap-nodejs'
          - node: 26
            homebridge: 2
            hap_module: '@homebridge/hap-nodejs'

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Lint and build with the Homebridge 2 API types
        run: npm run lint && npm run build

      - name: Install Homebridge 1
        if: matrix.homebridge == 1
        run: npm install --no-save --ignore-scripts --no-audit --no-fund homebridge@1.11.4

      - name: Test the project
        run: npm run test:built
        env:
          CI: true
          HAP_NODEJS_MODULE: ${{ matrix.hap_module }}

      - name: Create NPM package
        if: matrix.node == 24 && matrix.homebridge == 2
        run: npm pack

      - name: Upload NPM package
        if: matrix.node == 24 && matrix.homebridge == 2
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: '*.tgz'
